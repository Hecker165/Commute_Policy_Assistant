# Commute Policy Assistant — containerized startup (docker compose up --build)
#
# The API shares no state with other processes; Chroma/SQLite live in a
# dedicated volume. The Ollama service holds the local LLM; a one-shot
# sidecar pulls the model on first start (~2 GB download, cached in a volume).

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c"]
    # Retry the pull for up to ~10 minutes, then give up visibly.
    command: ["ollama pull ${LLM_MODEL:-llama3.2:3b} || (sleep 10 && ollama pull ${LLM_MODEL:-llama3.2:3b})"]
    restart: "no"
    volumes:
      - ollama-models:/root/.ollama

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /data
      POLICIES_DIR: /srv/app/data/policies
    volumes:
      - app-data:/data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  app-data:
  ollama-models:
